name: slow tests

# The tests the push workflow skips: fake-backend noise simulations, every board, and executing the notebooks.
# They take tens of minutes, so they run only on demand (Actions tab or `gh workflow run slow-tests.yml`),
# e.g. before merging changes to the notebooks or the noise code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # Actions are pinned by commit SHA; the comment names the release (the same pins as tests.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Slow tests
        # No IBM account is configured here, and none is needed: nothing in the suite reaches real hardware.
        run: pytest -m slow --durations=20
